  </defs>
  <rect width="600" height="400" fill="url(#g6)"/>
  <!-- app window -->
  <rect x="70" y="66" width="460" height="268" rx="14" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.22)"/>
  <circle cx="92" cy="90" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="108" cy="90" r="4" fill="rgba(255,255,255,0.35)"/>
  <circle cx="124" cy="90" r="4" fill="rgba(255,255,255,0.25)"/>
  <line x1="70" y1="112" x2="530" y2="112" stroke="rgba(255,255,255,0.15)"/>
  <!-- sidebar -->
  <rect x="88" y="130" width="96" height="10" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="88" y="152" width="70" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
  <rect x="88" y="170" width="82" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
  <rect x="88" y="188" width="64" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
  <!-- progress ring -->
  <circle cx="300" cy="180" r="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="10"/>
  <circle cx="300" cy="180" r="42" fill="none" stroke="#ff6a3d" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="190 264" transform="rotate(-90 300 180)"/>
  <!-- content cards -->
  <rect x="372" y="140" width="132" height="34" rx="8" fill="rgba(255,255,255,0.14)"/>
  <rect x="372" y="184" width="132" height="34" rx="8" fill="rgba(255,255,255,0.14)"/>
  <rect x="220" y="246" width="284" height="12" rx="6" fill="rgba(255,255,255,0.22)"/>
  <rect x="220" y="270" width="200" height="12" rx="6" fill="rgba(255,255,255,0.14)"/>
  <!-- label chip -->
  <text x="88" y="316" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="rgba(255,255,255,0.85)">SPFX · REACT · TYPESCRIPT</text>
